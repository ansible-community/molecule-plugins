# cspell: ignore NOCOWS PYTHONDONTWRITEBYTECODE

[project]
name = "molecule-plugins"
description = "Molecule Plugins"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ "name" = "Sorin Sbarnea", "email" = "sorin.sbarnea@gmail.com" }]
maintainers = [{ "name" = "Sorin Sbarnea", "email" = "sorin.sbarnea@gmail.com" }]
keywords = ["ansible", "molecule", "plugin", "testing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  # molecule plugins are not allowed to mention Ansible as a direct dependency
  "molecule>=25.1.0"
]
dynamic = ["version"]

[project.urls]
changelog = "https://github.com/ansible-community/molecule-plugins/releases"
documentation = "https://docs.ansible.com/projects/molecule/"
homepage = "https://github.com/ansible-community/molecule-plugins"
repository = "https://github.com/ansible-community/molecule-plugins"

[project.entry-points."molecule.driver"]
azure = "molecule_plugins.azure.driver:Azure"
containers = "molecule_plugins.containers.driver:Container"
docker = "molecule_plugins.docker.driver:Docker"
ec2 = "molecule_plugins.ec2.driver:EC2"
gce = "molecule_plugins.gce.driver:GCE"
podman = "molecule_plugins.podman.driver:Podman"
vagrant = "molecule_plugins.vagrant.driver:Vagrant"
openstack = "molecule_plugins.openstack.driver:Openstack"

[project.optional-dependencies]
azure = []
docker = [
  # selinux python module is needed as least by ansible-docker modules
  # and allows use of isolated (default) virtualenvs. It does not avoid need
  # to install the system selinux libraries but it will provide a clear
  # message when user has to do that.
  'selinux; sys_platform=="linux2"',
  'selinux; sys_platform=="linux"',
  "docker >= 4.3.1",
  "requests"  # also required by docker
]
ec2 = []
gce = ["requests >= 2.31.0", "google-auth >= 2.28.2"]
openstack = ["openstacksdk >= 1.1.0"]
podman = []
selinux = [
  # selinux python module is needed as least by podman and docker on systems
  # that do have selinux enabled and where code is running inside of an
  # isolated (default) virtualenv. It does not avoid need to install the
  # system selinux libraries but it will provide a clear message when user
  # has to do that.
  'selinux; sys_platform=="linux2"',
  'selinux; sys_platform=="linux"'
]
vagrant = ["python-vagrant"]

[dependency-groups]
dev = ["bindep>=2.13.0", "molecule[test]>=25.1.0", "pytest-helpers-namespace>=2019.1.8"]
docker = ["docker>=4.3.1", "requests>=2.32.5", "selinux>=0.3.0 ; sys_platform == 'linux2'", "selinux>=0.3.0 ; sys_platform == 'linux'"]
lint = ["ansible-lint>=6.12.1", "codespell>=2.4.1", "molecule>=25.7.0", "mypy>=1.17.1", "pip>=25.2", "prek>=0.5.0", "pydoclint>=0.7.1", "pylint>=3.3.8", "ruff>=0.12.11", "setuptools>=51.1.1", "tombi>=0.7.32"]
pkg = ["build>=0.9", "pip>=25.2", "pipx>=1.7.1", "twine>=4.0.1"]

[build-system]
requires = [
  "setuptools_scm[toml] >= 7.0.5",  # required for "no-local-version" scheme
  "setuptools >= 77.0.0",  # required by pyproject+setuptools_scm integration
]
build-backend = "setuptools.build_meta"

[tool.codespell]
ignore-words-list = "testbox"
skip = ".cache,.tox,.venv,dictionary.txt,.git,.ansible,.ruff_cache,.mypy_cache,dist,site,node_modules,uv.lock,*.egg-info"

[tool.mypy]
cache_dir = "./.cache/.mypy"
# To ensure that calling `mypy .` produces desired results (vscode)
# NOT strict on purpose: the driver sources are largely untyped legacy code and
# would require a large annotation effort to satisfy `strict = true`.
# Non-strict still catches genuine type errors without demanding annotations.
exclude = ["build", "test"]
files = ["src"]
python_version = "3.10"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "Crypto.*",  # pycryptodome, used by a standalone gce playbook script
  "ansible.module_utils.*",  # no py.typed marker
  "boto3.*",  # no stubs
  "docker.*",  # no stubs
  "googleapiclient.*",  # no stubs
  "selinux.*",  # optional linux-only
  "vagrant.*",  # no stubs
]

[[tool.mypy.overrides]]
# `DriverBackend` is conditionally imported from docker/podman, which mypy sees
# as an incompatible redefinition of the same name; harmless in practice.
disable_error_code = ["assignment"]
module = ["molecule_plugins.containers.driver"]

[tool.pydoclint]
allow-init-docstring = true
arg-type-hints-in-docstring = false
baseline = ".config/pydoclint-baseline.txt"
check-return-types = false
check-yield-types = false
exclude = '\.ansible|\.cache|\.git|\.tox|build|out|venv|test/scenarios'
quiet = true  # no need to print out the files being checked
should-document-private-class-attributes = true
show-filenames-in-every-violation-message = true
skip-checking-short-docstrings = false
style = "google"

[tool.pylint]
[tool.pylint.format]
max-line-length = 100

[tool.pylint.master]
good-names = "i,j,k,ex,Run,_,f,fh"
ignore = [
  "_version.py",  # built by setuptools_scm
]
jobs = 0
no-docstring-rgx = "__.*__"

[tool.pylint.messages_control]
disable = [
  "unknown-option-value",
  "R0401",  # cyclic-import — lazy imports in base.py -> worker.py are intentional
  # https://gist.github.com/cidrblock/ec3412bacfeb34dbc2d334c1d53bef83
  "C0103",  # invalid-name / ruff N815
  "C0105",  # typevar-name-incorrect-variance / ruff PLC0105
