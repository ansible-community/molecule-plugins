[tool.pytest.ini_options]
addopts = "-v -rxXs --doctest-modules --durations 10 -p no:pytest_ansible"
doctest_optionflags = "ALLOW_UNICODE ELLIPSIS"
junit_suite_name = "molecule_test_suite"
norecursedirs = ["dist", "doc", "build", ".tox", ".eggs", "src", "test/*/scenarios", "test/*/resources", "tools"]

[tool.ruff]
cache-dir = "./.cache/.ruff"
fix = true
line-length = 100
required-version = ">=0.7.1"
target-version = "py310"

[tool.ruff.lint]
ignore = [
  "E501",  # we use black
  # we deliberately ignore these:
  "EM102",
  # temporary disabled until we either fix them or decide to ignore them:
  "A001",
  "ANN",
  "ARG",
  "B006",
  "B028",
  "BLE",
  "C901",
  "COM812",
  "D",
  "DTZ",
  "FBT",
  "INP",
  "ISC",
  "N",
  "PERF203",
  "PGH",
  "PLR",
  "PT",
  "PTH",
  "RET",
  "S",
  # not sure we'll open a bug for every TODO.
  "TD003",
  "FIX002",
  "TRY"
]
select = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
lines-after-imports = 2  # Ensures consistency for cases when there's variable vs function/class definitions after imports
lines-between-types = 1  # Separate import/from with 1 line
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/molecule_plugins/_version.py"

[tool.tomlsort]
in_place = true
sort_inline_tables = true
sort_table_keys = true

[tool.tox]
env_list = ["deps", "lint", "pkg", "py", "devel"]
requires = ["tox>=4.46.0", "tox-extra>=2.2.0", "tox-uv >= 1.32.1"]
skip_missing_interpreters = true
isolated_build = true

[tool.tox.env.deps]
commands = [
  [
    "prek",
    "run",
    "--all-files",
    "--show-diff-on-failure",
    "--hook-stage",
    "manual",
    "deps",
  ],
  ["prek", "autoupdate"],
  ["tox", "-e", "lint"],
]
commands_pre = []
dependency_groups = ["lint"]
description = "Bump all test dependencies"
env_dir = "{work_dir}/lint"
runner = "uv-venv-runner"
skip_install = true

[tool.tox.env.devel]
deps = ["git+https://github.com/ansible-community/molecule.git@main#egg=molecule[test]"]
description = "Run the tests with newest dependencies (no lock and allowing prereleases)"
runner = "uv-venv-runner"
dependency_groups = ["dev"]
uv_sync_flags = ["--upgrade", "--prerelease=allow"]
uv_sync_locked = false

[tool.tox.env.lint]
dependency_groups = ["lint"]
description = "Run all linters"
runner = "uv-venv-lock-runner"
skip_install = false
commands_pre = []
commands = [["prek", "run", "--all-files", "--show-diff-on-failure"], ["bash", "{tox_root}/tools/generate-templates.sh"], ["rm", "-rf", "test/roles"]]

[tool.tox.env.pkg]
skip_install = true
dependency_groups = ["pkg"]
runner = "uv-venv-lock-runner"
commands = [["bash", "-c", "rm -rf {tox_root}/dist/ && mkdir -p {tox_root}/dist/"], ["python", "-m", "build"], ["twine", "check", "--strict", "dist/*"]]

[tool.tox.env_run_base]
description = "Unit testing"
skip_install = false
runner = "uv-venv-lock-runner"
allowlist_externals = ["bash", "rm"]
extras = ["azure", "docker", "ec2", "gce", "podman", "openstack", "vagrant"]
commands = [["ansible-galaxy", "install", "-r", "requirements.yml"], ["pytest", "--collect-only"], ["pytest", "--color=yes", "{tty:-s}"]]
pass_env = ["CI", "CURL_CA_BUNDLE", "DOCKER_*", "PYTEST_*", "REQUESTS_CA_BUNDLE", "SSH_AUTH_SOCK", "SSL_CERT_FILE", "TWINE_*", "OS_*"]

[tool.tox.env_run_base.set_env]
ANSIBLE_FORCE_COLOR = "{env:ANSIBLE_FORCE_COLOR:1}"
ANSIBLE_INVENTORY = "{tox_root}/tests/hosts.ini"
ANSIBLE_CONFIG = "{tox_root}/ansible.cfg"
ANSIBLE_NOCOWS = "1"
ANSIBLE_RETRY_FILES_ENABLED = "0"
ANSIBLE_VERBOSITY = "{env:ANSIBLE_VERBOSITY:0}"
MOLECULE_NO_LOG = "{env:MOLECULE_NO_LOG:0}"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PY_COLORS = "{env:PY_COLORS:1}"
PYTHONDONTWRITEBYTECODE = "1"
MOLECULE_OPTS = "--destroy always"
TESTBOX = "{env:TESTBOX:testbox}"

[tool.uv]
default-groups = ["dev", "lint", "pkg"]
package = true
