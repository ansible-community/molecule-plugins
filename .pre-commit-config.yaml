---
default_language_version:
  # minimal version we support officially as this will impact mypy, pylint
  # minimal version determined by minimal version required by ansible-core, but
  # we might keep a backwards compatibility version for older ones
  python: "3.11"
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/ansible/actions
    rev: v1.1.2
    hooks:
      - id: toml
        priority: 0
      - id: mypy
        priority: 1
        # run with no explicit path so `files = ["src"]` in [tool.mypy] is used;
        # `mypy .` would fail on the `test/vagrant-plugin` dir (invalid package name)
        entry: sh -c 'uv run -q --all-extras --group=lint -m mypy'
      - id: ruff
        priority: 0
      - id: codespell
        priority: 1
      - id: cspell
        priority: 0
      - id: yamllint
        priority: 0
      - id: md
        priority: 0
      - id: codecov
        priority: 0
      - id: shellcheck
        priority: 0
      - id: pydoclint
        priority: 1

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.8
    hooks:
      - id: uv-sync
      - id: uv-lock
      - id: uv-lock
        name: "deps: upgrade via uv sync --upgrade"
        alias: deps
        args: ["--upgrade"]
        stages: [manual]

  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.5.11"
    hooks:
      - id: biome-check
        name: biome
        alias: biome
        args: [--unsafe]
        priority: 0

  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        priority: 0

  - repo: https://github.com/pycqa/pylint.git
    rev: v4.0.8
    hooks:
      - id: pylint
        priority: 1
        args:
          - --output-format=colorized
        # Only lint the shipped drivers; the `test/` fixtures import pytest,
        # testinfra, pycryptodome, etc. and are not production code.
        files: ^src/
        # standalone script embedded in the gce playbook (imports pycryptodome)
        exclude: .*windows_auth\.py
        additional_dependencies:
          - ansible-compat>=25.1.4
          - boto3
          - docker>=4.3.1
          - google-api-python-client
          - jinja2
          - molecule>=25.7.0
          - openstacksdk>=1.1.0
          - python-vagrant
          - requests
          - selinux ; sys_platform=="linux"

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        entry: env ANSIBLE_ROLES_PATH="$ANSIBLE_ROLES_PATH:test/roles" ansible-lint
        args: [--fix]
        stages: [manual]
  - repo: https://github.com/ansible/team-devtools
    rev: v26.4.0
    hooks:
      - id: check-platform-constraints
